apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinegest-front
  namespace: cinegest-site
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: cinegest-site-ratelimit@kubernetescrd,cinegest-site-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - front.cinegest.nicolasbarbey.fr
      secretName: cinegest-front-tls
  rules:
    - host: front.cinegest.nicolasbarbey.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cinegest-front
                port:
                  number: 3000